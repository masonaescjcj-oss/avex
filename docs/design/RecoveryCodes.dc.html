<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="--n0:#ffffff;--n50:#f7f8f9;--n100:#eef0f2;--n200:#e3e6ea;--n300:#cfd4da;--n400:#a6adb7;--n500:#6b7480;--n600:#5b6370;--n700:#414853;--n900:#1a1d22;--lime:#c8f135;--lime-ink:#1a2400;--accent:#5f7a00;--accent-soft:#eef7c9;--accent-edge:#b9d95a;--ok:#0f7a4f;--ok-soft:#e3f5ec;--warn:#9a5b00;--warn-soft:#fff1d6;--danger:#b42318;--danger-soft:#fde8e6;--info:#175cd3;--info-soft:#e6effc;--bg:#f7f8f9;--surface:#ffffff;--surface-2:#f7f8f9;--surface-3:#eef0f2;--line:#e3e6ea;--line-strong:#cfd4da;--ink:#1a1d22;--ink-2:#414853;--muted:#5b6370;--faint:#6b7480;font-family:ui-sans-serif,-apple-system,Inter,Roboto,Arial,sans-serif;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased">
  <div style="flex:1;padding:22px 24px 0;">
    <div style="width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5.5 8.5 12l6.5 6.5"/></svg>
    </div>

    <h1 style="margin:22px 0 8px;font-size:27px;line-height:1.2;font-weight:650;letter-spacing:-0.02em;">Save your recovery codes</h1>
    <p style="margin:0 0 20px;color:var(--muted);line-height:1.5;">Each one signs you in once if you lose your authenticator.</p>

    <div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,0.05);padding:16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:11px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;letter-spacing:0.03em;color:var(--ink-2);">
      <span>4f2a-91cd</span><span>7b30-e5a1</span>
      <span>c18e-4d72</span><span>0a95-bf36</span>
      <span>e63d-2c08</span><span>91b7-6a4f</span>
      <span>3d5c-8e10</span><span>b204-97da</span>
      <span>6ef1-30b8</span><span>a87c-15e9</span>
    </div>

    <div style="display:flex;gap:10px;margin-top:14px;">
      <button style="width:100%;box-sizing:border-box;height:48px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:550;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;font-size:14px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 6.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h.5"/></svg>
        Copy
      </button>
      <button style="width:100%;box-sizing:border-box;height:48px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:550;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;font-size:14px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19h14"/></svg>
        Download
      </button>
    </div>

    <div style="display:flex;gap:11px;margin-top:20px;padding:13px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;line-height:1.45;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px;"><path d="M12 4.5 21 19H3Z"/><path d="M12 10v4M12 16.8v.1"/></svg>
      <span>This is the only time you will see them. We keep hashes, not the codes, so we cannot show them again.</span>
    </div>
  </div>

  <div style="padding:0 24px 34px;">
    <button style="width:100%;box-sizing:border-box;height:48px;border:0;border-radius:10px;background:var(--lime);color:var(--lime-ink);font-size:15px;font-weight:600;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px">I have saved them</button>
  </div>
</div>
</x-dc>
</body>
</html>
