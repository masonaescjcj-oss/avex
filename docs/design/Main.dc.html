<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="--n0:#ffffff;--n50:#f7f8f9;--n100:#eef0f2;--n200:#e3e6ea;--n300:#cfd4da;--n400:#a6adb7;--n500:#6b7480;--n600:#5b6370;--n700:#414853;--n900:#1a1d22;--lime:#c8f135;--lime-ink:#1a2400;--accent:#5f7a00;--accent-soft:#eef7c9;--accent-edge:#b9d95a;--ok:#0f7a4f;--ok-soft:#e3f5ec;--warn:#9a5b00;--warn-soft:#fff1d6;--danger:#b42318;--danger-soft:#fde8e6;--info:#175cd3;--info-soft:#e6effc;--bg:#f7f8f9;--surface:#ffffff;--surface-2:#f7f8f9;--surface-3:#eef0f2;--line:#e3e6ea;--line-strong:#cfd4da;--ink:#1a1d22;--ink-2:#414853;--muted:#5b6370;--faint:#6b7480;font-family:ui-sans-serif,-apple-system,Inter,Roboto,Arial,sans-serif;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased">
  <div style="padding:56px 24px 0;">
    <div style="display:flex;align-items:center;gap:10px;">
  <div style="width:36px;height:36px;border-radius:11px;background:var(--lime);color:var(--lime-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;letter-spacing:-0.02em;">A</div>
  <span style="font-weight:600;font-size:17px;letter-spacing:-0.015em;">AVEX Pay</span>
</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px 44px;">
    <h1 style="margin:0 0 6px;font-size:30px;line-height:1.15;font-weight:650;letter-spacing:-0.022em;">Sign in</h1>
    <p style="margin:0 0 30px;color:var(--muted);">To your merchant dashboard.</p>

    <label style="display:block;margin-bottom:16px;">
      <span style="display:block;font-size:13px;font-weight:550;color:var(--ink-2);margin-bottom:6px">Email</span>
      <div style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);box-sizing:border-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--faint);flex:none;"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
        <span>kian@kianshop.ir</span>
      </div>
    </label>

    <label style="display:block;margin-bottom:10px;">
      <span style="display:block;font-size:13px;font-weight:550;color:var(--ink-2);margin-bottom:6px">Password</span>
      <div style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid var(--accent-edge);border-radius:10px;background:var(--surface);box-sizing:border-box;box-shadow:0 0 0 3px rgba(95,122,0,0.18)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--faint);flex:none;"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg>
        <span style="flex:1;letter-spacing:0.18em;color:var(--ink-2);">••••••••••••</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--faint);flex:none;"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.75"/></svg>
      </div>
    </label>
    <p style="margin:0 0 26px;font-size:13px;color:var(--faint);">At least 10 characters — the only rule we set.</p>

    <button style="width:100%;box-sizing:border-box;height:48px;border:0;border-radius:10px;background:var(--lime);color:var(--lime-ink);font-size:15px;font-weight:600;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px">Sign in</button>

    <div style="display:flex;align-items:center;gap:9px;margin:22px 0 0;color:var(--muted);font-size:13px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg>
      <span>We ask for your authenticator code next.</span>
    </div>
  </div>

  <div style="padding:0 24px 34px;text-align:center;color:var(--muted);font-size:14px;">
    New here? <span style="color:var(--accent);font-weight:600;">Create a merchant account</span>
  </div>
</div>
</x-dc>
</body>
</html>
