<!doctype html>
<html>
<head>
  <meta charset="utf-8">

</head>
<body>
<x-dc>
<div style="--n0:#ffffff;--n50:#f7f8f9;--n100:#eef0f2;--n200:#e3e6ea;--n300:#cfd4da;--n400:#a6adb7;--n500:#6b7480;--n600:#5b6370;--n700:#414853;--n900:#1a1d22;--lime:#c8f135;--lime-ink:#1a2400;--accent:#5f7a00;--accent-soft:#eef7c9;--accent-edge:#b9d95a;--ok:#0f7a4f;--ok-soft:#e3f5ec;--warn:#9a5b00;--warn-soft:#fff1d6;--danger:#b42318;--danger-soft:#fde8e6;--info:#175cd3;--info-soft:#e6effc;--bg:#f7f8f9;--surface:#ffffff;--surface-2:#f7f8f9;--surface-3:#eef0f2;--line:#e3e6ea;--line-strong:#cfd4da;--ink:#1a1d22;--ink-2:#414853;--muted:#5b6370;--faint:#6b7480;font-family:ui-sans-serif,-apple-system,Inter,Roboto,Arial,sans-serif;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased">
  <div style="padding:52px 24px 0;">
    <div style="display:flex;align-items:center;gap:10px;">
  <svg viewBox="0 0 100 100" width="36" height="36" style="display:block;flex:none;" aria-hidden="true"><rect width="100" height="100" rx="22" fill="var(--lime)"/><g fill="var(--lime-ink)"><path fill-rule="evenodd" d="M47.7 19.5L52.3 19.5L55 20L58.4 21.1L61.7 22.7L61.7 23L64.1 24.2L67.2 26.7L73.3 33.6L78.4 42L83.1 53L85.3 60L85.9 63.3L86.3 63.4L87.5 70.3L87.8 70.6L88.3 74.5L83.3 74.5L81.6 71.1L78 65.9L73.1 61.1L69.1 58.1L62.8 55L57.5 53.4L53.3 52.8L46.4 52.8L42.2 53.4L38.3 54.5L33.4 56.6L27.8 60.2L23.1 64.4L19.5 68.9L16.4 74.5L11.4 74.5L13.1 65L16.9 52.3L20 44.7L25.2 35.5L29.8 29.4L35.6 24.2L41.3 21.1L47.5 19.5ZM49.1 24.1L45 24.7L40 26.9L37 28.9L31.9 34.1L28.8 38.8L28.4 38.8L28.1 39.8L27.3 40.6L24.2 46.6L21.1 54.2L18.8 62.5L21.9 59.4L22.7 56.3L25.8 48.3L28.4 43L28.8 43L29.4 41.4L32.5 37.2L32.5 36.7L35.8 33L39.4 29.8L40.8 29.2L40.8 28.9L43.9 27.3L48.6 26.3L53 26.6L56.9 27.8L61.6 30.8L64.8 33.9L68.4 38.4L72.7 45.6L75.3 51.6L78 59.5L81.1 62.5L80 58.3L78.8 55.2L78.9 54.8L75.3 46.1L75 46.1L74.2 43.9L71.3 38.8L68.6 35L63.3 29.4L58.6 26.3L54.7 24.7L49.2 24.1ZM48.1 30.9L45.2 31.9L41.4 34.1L37.2 38.3L34.5 41.9L32.8 45.2L32.5 45.2L28.4 54.1L33.6 51.4L37.7 50.2L37.8 49.8L42.2 48.8L47.2 48.1L54.7 48.3L59.7 49.2L65 50.9L71.3 54.1L69.5 49.7L69.2 49.7L69.1 48.8L68 46.6L67.7 46.6L66.9 44.5L66.6 44.5L65.9 43L63.4 39.4L60.6 36.1L57.7 33.6L53.9 31.6L51.6 30.9L48.3 30.9ZM49.4 54.8L55 55.2L59.2 56.1L63.4 57.7L67.7 59.8L71.4 62.5L75.5 66.4L78.1 70.2L78.4 70.2L80.8 74.5L75.6 74.5L73.8 71.6L70.2 67.5L66.9 64.8L63.9 63.3L63.9 63L57.2 60.3L52.2 59.5L44.7 59.8L40.9 60.8L37 62.3L32.7 65L30.2 67L26.7 70.6L24.1 74.5L18.9 74.5L21.1 70.5L24.2 66.4L27.2 63.4L31.6 60.2L34.8 58.3L38.6 56.7L40.3 56.4L40.5 56.1L44.7 55.2L49.2 54.8Z"/></g></svg>
  <span style="font-weight:600;font-size:17px;letter-spacing:-0.015em;">AVEX Pay</span>
</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px 40px;">
    <h1 style="margin:0 0 6px;font-size:28px;line-height:1.18;font-weight:650;letter-spacing:-0.022em;">Create your account</h1>
    <p style="margin:0 0 26px;color:var(--muted);">Two minutes. No documents, no card.</p>

    <label style="display:block;margin-bottom:14px;">
      <span style="display:block;font-size:13px;font-weight:550;color:var(--ink-2);margin-bottom:6px">Business name</span>
      <div style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);box-sizing:border-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--faint);flex:none;"><path d="M4 20V9l8-5 8 5v11"/><path d="M9.5 20v-5h5v5"/></svg>
        <span>Kian Shop</span>
      </div>
    </label>

    <label style="display:block;margin-bottom:14px;">
      <span style="display:block;font-size:13px;font-weight:550;color:var(--ink-2);margin-bottom:6px">Email</span>
      <div style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);box-sizing:border-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--faint);flex:none;"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
        <span>kian@kianshop.ir</span>
      </div>
    </label>

    <label style="display:block;">
      <span style="display:block;font-size:13px;font-weight:550;color:var(--ink-2);margin-bottom:6px">Password</span>
      <div style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid var(--accent-edge);border-radius:10px;background:var(--surface);box-sizing:border-box;box-shadow:0 0 0 3px rgba(95,122,0,0.18)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--faint);flex:none;"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg>
        <span style="flex:1;letter-spacing:0.18em;color:var(--ink-2);">••••••••••••••</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--faint);flex:none;"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.75"/></svg>
      </div>
    </label>

    <div style="display:flex;gap:5px;margin:10px 0 8px;">
      <div style="flex:1;height:4px;border-radius:999px;background:var(--lime);"></div>
      <div style="flex:1;height:4px;border-radius:999px;background:var(--lime);"></div>
      <div style="flex:1;height:4px;border-radius:999px;background:var(--lime);"></div>
      <div style="flex:1;height:4px;border-radius:999px;background:var(--n200);"></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;font-size:13px;">
      <span style="display:flex;align-items:center;gap:6px;color:var(--ok);font-weight:550;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
        14 characters
      </span>
      <span style="color:var(--faint);">10 is the minimum</span>
    </div>

    <div style="margin-top:24px;"><button style="width:100%;box-sizing:border-box;height:48px;border:0;border-radius:10px;background:var(--lime);color:var(--lime-ink);font-size:15px;font-weight:600;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px">Create account</button></div>

    <p style="margin:16px 0 0;font-size:13px;color:var(--faint);line-height:1.5;">We send a confirmation link to that address. Nothing goes live until you confirm it.</p>
  </div>

  <div style="padding:0 24px 34px;text-align:center;color:var(--muted);font-size:14px;">
    Already have an account? <span style="color:var(--accent);font-weight:600;">Sign in</span>
  </div>
</div>
</x-dc>
</body>
</html>
