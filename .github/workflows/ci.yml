name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: avex
          POSTGRES_PASSWORD: avex
          POSTGRES_DB: avex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avex -d avex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://avex:avex@localhost:5432/avex

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Build mode resolves project references in dependency order, so the API
      # cannot be compiled before the package it depends on.
      - name: Build
        run: npx tsc -b apps/api --verbose

      # TypeScript's incremental cache can report a build as current and emit
      # nothing, which surfaces far away as "Cannot find module '@avex/core'".
      # Assert the outputs exist so that failure is caught here instead.
      - name: Verify build output
        run: |
          for artifact in packages/core/dist/index.js packages/core/dist/index.d.ts apps/api/dist/main.js; do
            test -f "$artifact" || { echo "::error::build produced no $artifact"; exit 1; }
          done

      # Compiles the contracts and executes them on an in-process EVM. Needs no
      # testnet, no key and no funds, so the check that the off-chain deposit
      # address matches on-chain CREATE2 runs on every commit.
      - name: Verify contracts on an EVM
        working-directory: contracts
        run: npm test

      - name: Test checkout
        working-directory: apps/checkout
        run: npm test

      - name: Apply migrations
        working-directory: apps/api
        run: npx drizzle-kit migrate

      - name: Test core
        working-directory: packages/core
        run: node --test "dist/**/*.test.js"

      # DATABASE_URL is set, so the integration suite runs rather than skipping.
      - name: Test api
        working-directory: apps/api
        run: node --test "dist/**/*.test.js"
