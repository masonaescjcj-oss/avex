# Local development dependencies. Not a production topology.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: avex
      POSTGRES_PASSWORD: avex
      POSTGRES_DB: avex
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avex -d avex']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
