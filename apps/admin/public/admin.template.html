<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Where the API is.
  
  Empty means same origin, which is right when one host serves both. A split deployment —
  static pages on one host, the API on another — fills this in at build time, and every
  request the page makes goes through it. See docs/DEPLOY.md.
-->
<meta name="avex-api" content="">
<title>AVEX Pay Admin</title>
<style>
  /**
   * AVEX Pay admin panel.
   *
   * Same design language as the checkout and the planning documents: pure black
   * ground, acid lime for the one thing that matters per view, dark cards at a
   * 14-20px radius, monospace for every number and identifier.
   *
   * One deliberate difference from the checkout. Lime is used far more sparingly
   * here, because this panel is dense with numbers and an accent that appears on
   * every second figure stops meaning anything. It is reserved for the primary
   * action and for a value that is currently wrong.
   */
  :root {
    --void: #000000;
    --card: #121212;
    --card-2: #1A1A1A;
    --card-3: #242424;
    --line: #262626;
    --line-2: #333333;

    --ink: #FFFFFF;
    --muted: #8B8B8B;
    --faint: #5A5A5A;

    --lime: #C6F73F;
    --lime-ink: #0A0A0A;
    --lime-wash: rgba(198, 247, 63, 0.10);
    --lime-edge: rgba(198, 247, 63, 0.28);

    --teal: #2ED3A0;
    --teal-wash: rgba(46, 211, 160, 0.12);
    --amber: #F5A623;
    --amber-wash: rgba(245, 166, 35, 0.12);
    --coral: #FF5A4E;
    --coral-wash: rgba(255, 90, 78, 0.12);
    --violet: #8B7CF6;

    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;

    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 10px;
    --pill: 999px;

    --s-2: 0.6875rem;
    --s-1: 0.8125rem;
    --s0: 0.9375rem;
    --s1: 1.0625rem;
    --s2: 1.375rem;
    --s3: 1.875rem;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: var(--sans);
    font-size: var(--s0);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  [hidden] { display: none !important; }

  /* ── shell ──────────────────────────────────────────────────────────── */

  .shell { display: grid; grid-template-columns: 13rem minmax(0, 1fr); min-height: 100vh; }

  .side {
    background: var(--card);
    border-inline-end: 1px solid var(--line);
    padding: 1.25rem 0.875rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; }
  /**
   * The mark, drawn rather than fetched.
   *
   * This page is one file and reaches no host, so a logo has to be inline — and two arches is
   * less markup than the base64 of a picture of two arches. Sharp at any size, and `flex: none`
   * because a flex row squashes an image before it squashes the text beside it.
   */
  .brand-mark { width: 1.625rem; height: 1.625rem; flex: none; display: block; }
  .brand-sub {
    font-family: var(--mono);
    font-size: var(--s-2);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
  }

  nav { display: flex; flex-direction: column; gap: 0.15rem; }
  .nav-btn {
    display: flex; align-items: center; gap: 0.5rem;
    width: 100%; padding: 0.5rem 0.625rem;
    border: none; background: transparent;
    border-radius: var(--r-sm);
    color: var(--muted); font: inherit; font-size: var(--s-1);
    text-align: left; cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .nav-btn:hover { background: var(--card-2); color: var(--ink); }
  .nav-btn[aria-current="true"] { background: var(--lime-wash); color: var(--lime); font-weight: 700; }
  .nav-btn:focus-visible { outline: 2px solid var(--lime); outline-offset: 1px; }
  .nav-count {
    margin-inline-start: auto;
    font-family: var(--mono); font-size: var(--s-2);
    background: var(--card-3); color: var(--muted);
    border-radius: var(--pill); padding: 0.05rem 0.4rem;
  }
  .nav-count.alert { background: var(--coral-wash); color: var(--coral); }

  .whoami {
    margin-top: auto;
    border-top: 1px solid var(--line);
    padding-top: 0.875rem;
    display: flex; flex-direction: column; gap: 0.3rem;
    font-size: var(--s-2);
  }
  .whoami-email { font-family: var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .role-pill {
    align-self: flex-start;
    font-family: var(--mono); font-size: var(--s-2);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0.1rem 0.5rem; border-radius: var(--pill);
    background: var(--card-3); color: var(--muted);
  }
  .role-pill[data-role="operator"] { background: var(--teal-wash); color: var(--teal); }
  .role-pill[data-role="superadmin"] { background: var(--lime-wash); color: var(--lime); }

  main { padding: clamp(1rem, 2.5vw, 1.75rem); min-width: 0; }

  .head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;
  }
  h1 { font-size: var(--s2); font-weight: 800; margin: 0; letter-spacing: -0.015em; }
  h2 { font-size: var(--s1); font-weight: 700; margin: 0; }
  .sub { color: var(--muted); font-size: var(--s-1); margin: 0.15rem 0 0; }

  /* ── cards, tables ──────────────────────────────────────────────────── */

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    overflow: hidden;
  }
  .card-head {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
  }
  .card-body { padding: 1rem; }

  .grid { display: grid; gap: 0.625rem; }
  .grid.cols { grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); }

  .metric {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 0.875rem 1rem;
    display: flex; flex-direction: column; gap: 0.1rem;
  }
  .metric-value {
    font-family: var(--mono); font-size: var(--s3); font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .metric-label { font-size: var(--s-2); color: var(--muted); }
  .metric.bad { border-color: rgba(255, 90, 78, 0.3); }
  .metric.bad .metric-value { color: var(--coral); }
  .metric.warn { border-color: rgba(245, 166, 35, 0.3); }
  .metric.warn .metric-value { color: var(--amber); }
  .metric.good .metric-value { color: var(--teal); }

  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: var(--s-1); }
  th, td {
    text-align: left; padding: 0.55rem 0.75rem;
    border-bottom: 1px solid var(--line); vertical-align: top;
  }
  th {
    font-size: var(--s-2); text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--faint); font-weight: 600; white-space: nowrap;
    position: sticky; top: 0; background: var(--card);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: var(--card-2); }
  td.m, th.m {
    font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .dim { color: var(--muted); }
  .faint { color: var(--faint); }

  .tag {
    display: inline-block;
    font-family: var(--mono); font-size: var(--s-2);
    padding: 0.05rem 0.45rem; border-radius: var(--pill);
    background: var(--card-3); color: var(--muted); white-space: nowrap;
  }
  .tag.ok { background: var(--teal-wash); color: var(--teal); }
  .tag.warn { background: var(--amber-wash); color: var(--amber); }
  .tag.bad { background: var(--coral-wash); color: var(--coral); }
  .tag.lime { background: var(--lime-wash); color: var(--lime); }
  .tag.violet { background: rgba(139, 124, 246, 0.14); color: var(--violet); }

  /* ── controls ───────────────────────────────────────────────────────── */

  .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

  input[type="text"], input[type="password"], input[type="search"], select, textarea {
    background: var(--card-2); color: var(--ink);
    border: 1px solid var(--line-2); border-radius: var(--r-sm);
    padding: 0.45rem 0.625rem; font: inherit; font-size: var(--s-1);
    min-width: 0;
  }
  textarea { width: 100%; resize: vertical; min-height: 4.5rem; line-height: 1.5; }
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--lime); outline-offset: 1px;
  }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  .mono-input { font-family: var(--mono); }

  button {
    font: inherit; cursor: pointer;
    border-radius: var(--pill);
    transition: filter 120ms ease, background 120ms ease, color 120ms ease;
  }
  .btn {
    padding: 0.4rem 0.9rem; font-size: var(--s-1); font-weight: 600;
    background: var(--card-3); color: var(--ink); border: 1px solid var(--line-2);
  }
  .btn:hover:not(:disabled) { background: var(--line-2); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--lime); color: var(--lime-ink); border-color: var(--lime); font-weight: 700; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--lime); }
  .btn.danger { background: transparent; color: var(--coral); border-color: rgba(255, 90, 78, 0.4); }
  .btn.danger:hover:not(:disabled) { background: var(--coral-wash); }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.ghost:hover:not(:disabled) { color: var(--ink); background: var(--card-2); }
  .btn:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  .btn.sm { padding: 0.2rem 0.6rem; font-size: var(--s-2); }

  /* ── notices ────────────────────────────────────────────────────────── */

  .notice {
    padding: 0.7rem 0.875rem; border-radius: var(--r-sm);
    font-size: var(--s-1); line-height: 1.5;
    display: flex; gap: 0.5rem; align-items: flex-start;
  }
  .notice.info { background: var(--card-2); color: var(--muted); }
  .notice.ok { background: var(--teal-wash); color: var(--teal); }
  .notice.warn { background: var(--amber-wash); color: var(--amber); }
  .notice.bad { background: var(--coral-wash); color: var(--coral); }
  .notice strong { color: var(--ink); }

  .empty { padding: 2rem 1rem; text-align: center; color: var(--faint); font-size: var(--s-1); }
  .empty-mark { font-size: 1.5rem; display: block; margin-bottom: 0.4rem; }

  /* ── modal ──────────────────────────────────────────────────────────── */

  .veil {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.72);
    display: grid; place-items: center; padding: 1rem; z-index: 20;
  }
  .modal {
    background: var(--card); border: 1px solid var(--line-2);
    border-radius: var(--r-lg); padding: 1.25rem;
    width: min(34rem, 100%);
    display: flex; flex-direction: column; gap: 0.75rem;
    max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { font-size: var(--s1); }
  .modal-note { font-size: var(--s-1); color: var(--muted); margin: 0; }
  .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.25rem; }
  .field-label {
    font-size: var(--s-2); text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 600; display: block; margin-bottom: 0.25rem;
  }

  /* ── sign in ────────────────────────────────────────────────────────── */

  .signin-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
  .signin {
    width: min(24rem, 100%);
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 1.5rem;
    display: flex; flex-direction: column; gap: 0.875rem;
  }
  .signin input { width: 100%; }
  .signin .btn { width: 100%; text-align: center; justify-content: center; }

  .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.3rem 0.875rem; font-size: var(--s-1); }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }

  @media (max-width: 52rem) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .side { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    nav { flex-direction: row; flex-wrap: wrap; }
    .whoami { margin: 0 0 0 auto; border: none; padding: 0; align-items: flex-end; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<!-- ══ sign in ══════════════════════════════════════════════════════════ -->
<!--
  Said before anything else, and not dismissible. A panel full of plausible figures that
  somebody takes for their real system is worse than no preview.
-->
<div class="notice bad" id="preview-banner" hidden style="margin:1rem;border-radius:14px">
  <span>
    <strong>Preview. </strong>
    Every figure here is made up and nothing can be changed. It is the real staff panel
    driven by canned answers instead of a server, so what you click is what ships — but this
    is not your system.
  </span>
</div>

<div class="signin-wrap" id="signin-screen">
  <form class="signin" id="signin-form">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect width="100" height="100" rx="22" fill="var(--lime)"></rect><g fill="none" stroke="var(--void)" stroke-width="9"><path d="M12 86C14.6 39 32.7 13 50 13C67.3 13 85.4 39 88 86"></path><path d="M28 86C29.5 55 38.5 33 50 33C61.5 33 70.5 55 72 86"></path></g></svg>

<!-- ══ panel ════════════════════════════════════════════════════════════ -->
<div class="shell" id="panel" hidden>
  <aside class="side">
    <div>
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect width="100" height="100" rx="22" fill="var(--lime)"></rect><g fill="none" stroke="var(--void)" stroke-width="9"><path d="M12 86C14.6 39 32.7 13 50 13C67.3 13 85.4 39 88 86"></path><path d="M28 86C29.5 55 38.5 33 50 33C61.5 33 70.5 55 72 86"></path></g></svg>
        <span>AVEX <span style="color:var(--lime)">Admin</span></span>
      </div>
      <div class="brand-sub" style="margin-top:.35rem">staff panel</div>
    </div>

    <nav id="nav" aria-label="Sections"></nav>

    <div class="whoami">
      <span class="role-pill" id="me-role">—</span>
      <span class="whoami-email" id="me-email">—</span>
      <button class="btn ghost sm" type="button" id="sign-out">Sign out</button>
    </div>
  </aside>

  <main>
    <div class="notice bad" id="global-error" hidden></div>
    <div class="notice ok" id="global-ok" hidden></div>
    <section id="view"></section>
  </main>
</div>

<div id="modal-root"></div>

<script>
/* @inject:modules */

(() => {
  'use strict';

  /**
   * The panel is one file with no framework, and that is a decision rather than a
   * shortcut.
   *
   * This origin can suspend merchants and approve assets that the whole platform
   * then treats as money. Every dependency shipped here is code running with those
   * powers, so for six mostly-read screens the smallest possible surface is worth
   * more than the convenience of a component library.
   *
   * The session token is held in a variable, never in `localStorage`. An XSS on this
   * origin would be able to read storage; a token in a closure at least dies with the
   * tab, and the eight-hour server-side expiry does the rest.
   */
  /**
   * The same `<meta>` every other page in this product reads.
   *
   * It was `window.AVEX_ADMIN_API`, a global nothing set — so this page's API base was always
   * empty and only a same-origin deployment worked. One mechanism across four pages means one
   * thing for a deployment to fill in rather than four things to remember.
   */
  const API = (document.querySelector('meta[name="avex-api"]')?.content ?? '').replace(/\/$/, '');

  let token = null;
  let me = null;
  let section = null;
  /** Cached counts for the nav badges, refreshed whenever health is fetched. */
  let badges = { unmatched: 0, review: 0 };

  const el = (id) => document.getElementById(id);
  const view = () => el('view');

  /**
   * Replace a container's children, dropping the absent ones.
   *
   * `replaceChildren` stringifies whatever it is given, so a `null` from a
   * conditional expression renders as the literal text "null" on the page. Sections
   * are built with `cond ? node : null`, so every render site needs this rather than
   * the raw DOM call — which is why it exists as a helper instead of a comment
   * telling people to remember.
   */
  function render(container, ...children) {
    container.replaceChildren(...children.flat().filter((child) => child !== null && child !== undefined && child !== false));
  }

  // ── transport ───────────────────────────────────────────────────────────

  class ApiError extends Error {
    constructor(status, body) {
      super(body?.message ?? `request failed with ${status}`);
      this.status = status;
      this.body = body ?? {};
    }
  }

  async function api(path, options = {}) {
    const response = await fetch(`${API}${path}`, {
      method: options.method ?? 'GET',
      headers: {
        ...(token ? { authorization: `Bearer ${token}` } : {}),
        ...(options.body ? { 'content-type': 'application/json' } : {}),
      },
      ...(options.body ? { body: JSON.stringify(options.body) } : {}),
    });

    let body = null;
    try {
      body = await response.json();
    } catch {
      // A non-JSON body is still a failure worth reporting with its status.
    }

    if (!response.ok) throw new ApiError(response.status, body);
    return body;
  }

  // ── notices ─────────────────────────────────────────────────────────────

  let okTimer = null;
  function showOk(message) {
    const node = el('global-ok');
    node.textContent = message;
    node.hidden = false;
    clearTimeout(okTimer);
    okTimer = setTimeout(() => { node.hidden = true; }, 6000);
  }

  function showError(error) {
    const node = el('global-error');
    node.textContent = error instanceof ApiError ? error.message : String(error?.message ?? error);
    node.hidden = false;
  }

  function clearNotices() {
    el('global-error').hidden = true;
  }

  // ── small DOM helpers ───────────────────────────────────────────────────

  /**
   * Build an element. Text is always set through `textContent`.
   *
   * Nothing in this panel assigns `innerHTML` from data. Merchant names, review
   * notes and audit metadata are all attacker-influenced — a merchant chooses their
   * own organisation name — and this is the origin where a script must never run.
   */
  function h(tag, attrs = {}, children = []) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value === null || value === undefined || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = String(value);
      else if (key === 'onclick') node.addEventListener('click', value);
      else if (key === 'onsubmit') node.addEventListener('submit', value);
      else node.setAttribute(key, value === true ? '' : String(value));
    }
    for (const child of [].concat(children)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(typeof child === 'object' ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  const td = (text, cls) => h('td', { class: cls, text });
  const tag = (text, kind) => h('span', { class: `tag ${kind ?? ''}`.trim(), text });

  function table(headers, rows) {
    if (rows.length === 0) return empty('Nothing here.');
    return h('div', { class: 'card' }, [
      h('div', { class: 'scroll' }, [
        h('table', {}, [
          h('thead', {}, [h('tr', {}, headers.map((header) => h('th', { class: header.mono ? 'm' : null, text: header.label ?? header })))]),
          h('tbody', {}, rows),
        ]),
      ]),
    ]);
  }

  function empty(message, mark = '🗒️') {
    return h('div', { class: 'card' }, [
      h('div', { class: 'empty' }, [h('span', { class: 'empty-mark', text: mark }), message]),
    ]);
  }

  function metric(label, value, kind) {
    return h('div', { class: `metric ${kind ?? ''}`.trim() }, [
      h('div', { class: 'metric-value', text: value }),
      h('div', { class: 'metric-label', text: label }),
    ]);
  }

  /**
   * What this account pays us, and what it has paid us.
   *
   * On the merchant page rather than in a section of its own, because it is read in the
   * same breath as everything else about an account — and because whoever can change the
   * rate is looking at this page when they decide to.
   */
  function commissionBlock(org, data) {
    const plan = data.commission;
    const earned = data.commissionEarned ?? { creditedUsdMicros: '0', settledUsdMicros: '0' };

    if (!plan) {
      /**
       * A gap in our own bookkeeping, said plainly.
       *
       * An account with no plan row is charged nothing at all — `feeFor` returns nothing
       * rather than guessing — so this is revenue we are not collecting, not a display bug.
       */
      return h('div', { class: 'notice warn' }, [
        h('span', {}, [
          h('strong', { text: 'No fee plan. ' }),
          'This account is being charged no commission at all. Every invoice it opens ' +
            'carries a zero rate, which is our gap rather than theirs.',
        ]),
      ]);
    }

    const rate = (plan.commission.feeBps / 100).toFixed(2).replace(/\.?0+$/, '') + '%';
    const actions = [];
    if (can(me.permissions, 'staff:write')) {
      actions.push(
        h('button', { class: 'btn', type: 'button', text: 'Change rate', onclick: () => changeRate(org, plan) }),
      );
    }

    return h('div', {}, [
      h('div', { class: 'grid cols', style: 'margin-bottom:.75rem' }, [
        metric('Rate', rate, plan.commission.negotiated ? 'warn' : null),
        /**
         * Two figures, not one. `credited` is commission the chain owes us and will
         * deliver when the invoice is swept; `settled` is the part that has arrived. A
         * single number would overstate what we hold.
         */
        metric('Earned', formatUsdMicros(earned.creditedUsdMicros)),
        metric('Swept', formatUsdMicros(earned.settledUsdMicros)),
        metric('This period', formatUsdMicros(plan.period.processedUsdMicros)),
      ]),
      h('p', { class: 'sub', style: 'margin:0 0 .5rem' }, [
        plan.commission.negotiated
          ? 'Negotiated, so the volume ladder leaves it alone. '
          : 'From the published ladder. ' +
            (plan.period.wouldEarnBps === plan.commission.feeBps
              ? 'This period earns the same rate. '
              : 'This period so far earns ' +
                (plan.period.wouldEarnBps / 100).toFixed(2).replace(/\.?0+$/, '') + '%, from the next period. '),
        /**
         * Read-only, and worth saying why rather than leaving an operator hunting for the
         * control. Who bears the commission changes what the merchant's own customers are
         * asked to pay. That is their pricing decision — we receive the same either way —
         * so staff changing it would be us setting a merchant's prices.
         */
        plan.commission.feePayer === 'payer'
          ? 'Their customers pay the commission on top; they set that themselves.'
          : 'They absorb the commission; they can pass it on themselves if they choose.',
      ]),
      actions.length > 0 ? h('div', { class: 'row' }, actions) : null,
    ]);
  }

  /** The gap notices: the ones nobody has to do anything about, and the ones somebody does. */
  function gapNotices(gaps, mayList) {
    const open = gaps.filter((gap) => gap.kind !== 'not_issued');
    const closed = gaps.filter((gap) => gap.kind === 'not_issued');
    const name = (gap) => gap.symbol + ' on ' + gap.chain;

    return [
      open.length > 0
        ? h('div', { class: 'notice bad', style: 'margin-bottom:1rem' }, [
            h('span', {}, [
              h('strong', { text: 'Missing and worth adding: ' }),
              open.map(name).join(', ') + '. ',
              open.some((gap) => gap.kind === null)
                ? 'At least one of these has no recorded reason, which means nobody decided — it was missed. '
                : 'These exist; nobody has read the address off the issuer’s own page yet. ',
              mayList
                ? 'Verify it against the issuer, then use "Add a currency" — a curated entry arrives approved with no probe behind it.'
                : '',
            ]),
          ])
        : null,
      closed.length > 0
        ? h('div', { class: 'notice info', style: 'margin-bottom:1rem' }, [
            h('span', {}, [
              h('strong', { text: 'Not offered by the issuer: ' }),
              closed.map(name).join(', ') + '. ',
              /**
               * The reason is shown in full rather than summarised, because the important one
               * is counter-intuitive: USDC on TRON *used to* exist, so its contract is still
               * on chain and would probe perfectly well.
               */
              closed.map((gap) => gap.reason).filter(Boolean).join(' '),
            ]),
          ])
        : null,
    ];
  }

  function setListing(asset) {
    const opening = !asset.listed;
    prompt({
      title: (opening ? 'Open ' : 'Close ') + asset.symbol + ' on ' + asset.chain,
      note: opening
        ? 'Every merchant will be able to enable it. Nobody starts accepting it until they ' +
          'do, so this opens a door rather than changing anyone\'s configuration.'
        : asset.enabledByMerchants +
          ' merchant(s) are accepting this right now and will stop being able to open new ' +
          'invoices in it. Invoices already open still complete — their deposit addresses ' +
          'are committed and a payer may be mid-transfer.',
      permission: 'asset_list:write',
      danger: !opening,
      fields: [
        {
          name: 'note',
          label: 'Why (recorded)',
          type: 'textarea',
          placeholder: opening
            ? 'e.g. Solana watcher deployed and caught up; price feed corroborating.'
            : 'e.g. Solana RPC unreliable since 14:00; closing until it settles.',
        },
      ],
      confirmLabel: opening ? 'Open it' : 'Close it',
      onConfirm: async (values) => {
        await api('/admin/assets/' + asset.id + '/listing', {
          method: 'POST',
          body: { listed: opening, note: values.note },

      },

  function addAsset() {
    prompt({
      title: 'Add a currency',
      /**
       * The warning is the point of this dialog. It bypasses the automatic probe, so it is
       * the one place in the panel where a mistyped address becomes an approved asset for
       * every merchant at once.
       */
      note:
        'This adds the currency already approved, without probing the contract. Check the ' +
        'address against the issuer\'s own documentation before you paste it — the whole ' +
        'defence against a token calling itself USDT is knowing where the real one lives. ' +
        'Leave the contract blank for a chain\'s native asset.',
      permission: 'asset_list:write',
      fields: [
        { name: 'chain', label: 'Chain (bsc, ethereum, polygon, ton, tron, solana)' },
        { name: 'symbol', label: 'Symbol', mono: true },
        { name: 'contract', label: 'Contract or mint address (blank for native)', mono: true },
        { name: 'decimals', label: 'Decimals', mono: true },
        { name: 'kind', label: 'Kind (native, erc20, trc20, spl, jetton)' },
        {
          name: 'note',
          label: 'Where you verified it (recorded)',
          type: 'textarea',
          placeholder: 'e.g. Address published at tether.to/en/transparency, checked 18 Aug.',
        },
      ],
      confirmLabel: 'Add it',
      onConfirm: async (values) => {
        await api('/admin/assets', {
          method: 'POST',
          body: {
            chain: values.chain,
            symbol: values.symbol,
            // Blank means native, and an empty string is not an address.
            contract: values.contract === '' ? null : values.contract,
            decimals: Number(values.decimals),
            kind: values.kind,
            note: values.note,
          },
        });
        await refresh();
      },
    });

  /**
   * What this account owes us, and the two ways it moves by hand.
   *
   * A balance exists only because of chains where our cut cannot be taken on chain — the payer
   * pays the merchant's own wallet and nothing of ours is in the path. It clears itself from the
   * raised fee on their next invoice elsewhere, so most accounts sit near zero and this block is
   * mostly a place to answer "why is my fee 2.5% this month".
   *
   * The two buttons are different claims, not one signed number. "They paid us" and "we wrote it
   * off" are both a credit, only one of them is true, and the merchant reads this statement.
   */
  function balanceBlock(org, balance) {
    if (!balance) {
      return h('div', { class: 'notice warn' }, [
        h('span', {}, [h('strong', { text: 'Balance unavailable. ' }), 'Could not be read.']),
      ]);
    }

    const owed = BigInt(balance.balanceUsdMicros);
    const blocked = balance.canInvoiceOnAccruingChains === false;
    const actions = [];
    if (can(me.permissions, 'staff:write')) {
      actions.push(
        h('button', { class: 'btn primary', type: 'button', text: 'They paid us', onclick: () => recordBalance(org, 'settlement') }),
        h('button', { class: 'btn', type: 'button', text: 'Adjust', onclick: () => recordBalance(org, 'adjustment') }),
      );
    }

    const entries = balance.entries || [];

    return h('div', {}, [
      h('div', { class: 'grid cols', style: 'margin-bottom:.75rem' }, [
        metric('Balance', formatUsdMicros(balance.balanceUsdMicros), owed < 0n ? 'warn' : 'good'),
        metric('Limit', formatUsdMicros(balance.creditLimitUsdMicros)),
        metric('Accruing chains', blocked ? 'Paused' : 'Open', blocked ? 'bad' : 'good'),
      ]),
      blocked
        ? h('div', { class: 'notice bad', style: 'margin-bottom:.75rem' }, [
            h('span', {}, [
              h('strong', { text: 'Past the limit. ' }),
              'New TRON invoices are refused for this account, and TRON is not offered at their ' +
                'checkouts. Invoices on chains that take the cut on chain still work, and those ' +
                'are what clear the balance.',
            ]),
          ])
        : null,
      actions.length > 0 ? h('div', { class: 'row', style: 'margin-bottom:.75rem' }, actions) : null,
      entries.length === 0
        ? h('p', { class: 'sub', style: 'margin:0', text: 'No entries. Nothing has ever been owed on this account.' })
        : table(['When', 'Kind', 'Amount', 'Reason'], entries.map((entry) => {
            const amount = BigInt(entry.amountUsdMicros);
            return h('tr', {}, [
              td(formatAgo(entry.createdAt), 'm'),
              h('td', {}, [tag(entry.kind, amount < 0n ? 'warn' : 'ok')]),
              // The magnitude; the tone and the kind carry the direction. A column mixing
              // `-$0.50` and `$0.50` is misread at a glance, and a statement is read at a glance.
              td(formatUsdMicros((amount < 0n ? -amount : amount).toString()), 'num'),
              h('td', { class: 'dim', text: entry.note ?? '—' }),
            ]);
          })),
    ]);
  }

  /**
   * Move a balance by hand.
   *
   * Taken in dollars, not micro-dollars. The API speaks micro-dollars because every money
   * figure in it does, but an operator typing `40000000` to mean forty dollars will eventually
   * type it with one zero too many — and the mistake is invisible afterwards, because a wrong
   * balance looks exactly like one somebody meant. The server bounds it too; this removes the
   * chance rather than catching it.
   */
  function recordBalance(org, kind) {
    const settling = kind === 'settlement';
    prompt({
      title: (settling ? 'Record a payment from ' : 'Adjust the balance for ') + org.name,
      note: settling
        ? 'They have paid us directly. Enter what they paid, in dollars — this reduces what ' +
          'they owe. The note is on the statement they can read, so write what a merchant ' +
          'would recognise: how they paid, and when.'
        : 'A correction. Positive reduces what they owe; negative increases it. In dollars. ' +
          'The note is on the statement they can read, and it is the only record of why the ' +
          'number changed.',
      permission: 'staff:write',
      fields: [
        { name: 'amount', label: settling ? 'Amount paid (USD)' : 'Adjustment (USD, may be negative)', mono: true, placeholder: '40.00' },
        { name: 'note', label: 'Why (recorded, and shown to them)', type: 'textarea', placeholder: 'At least ten characters.' },
      ],
      confirmLabel: settling ? 'Record payment' : 'Adjust',
      onConfirm: async (values) => {
        await api('/admin/balances/' + org.id, {
          method: 'POST',
          body: {
            kind,
            amountUsdMicros: dollarsToMicros(values.amount),
            note: values.note,
          },
        });
        await openMerchant(org.id);
      },
    });
  }

  /**
   * A dollar string as micro-dollars, digit by digit.
   *
   * Never through a float: `40.01` has no exact binary representation, and a balance a cent out
   * is a balance that never reconciles. The sign is carried separately so a leading minus does
   * not end up inside the digits.
   */
  function dollarsToMicros(input) {
    const raw = String(input ?? '').trim();
    const negative = raw.startsWith('-');
    const parts = raw.replace(/^[+-]/, '').split('.');
    const whole = (parts[0] || '0').replace(/\D/g, '') || '0';
    const fraction = (parts[1] || '').replace(/\D/g, '').padEnd(6, '0').slice(0, 6);
    const digits = (whole + fraction).replace(/^0+(?=\d)/, '');
    return (negative ? '-' : '') + (digits === '' ? '0' : digits);
  }

  function changeRate(org, plan) {
    prompt({
      title: 'Change ' + org.name + "'s commission",
      note:
        'In basis points: 50 is 0.5%. Applies to invoices opened from now on — invoices ' +
        'already issued keep the rate they were quoted with, because their deposit ' +
        'addresses commit to it. Setting a rate by hand marks the account as negotiated, ' +
        'so the volume ladder will stop moving it.',
      permission: 'staff:write',
      fields: [
        { name: 'feeBps', label: 'Basis points', value: String(plan.commission.feeBps), mono: true },
        { name: 'note', label: 'Why (recorded)', type: 'textarea', placeholder: 'At least ten characters — the only record of why this account pays a different rate.' },
      ],
      confirmLabel: 'Set rate',
      onConfirm: async (values) => {
        await api('/admin/commission/' + org.id, {
          method: 'POST',
          body: { feeBps: Number(values.feeBps), note: values.note },
        });
        // Re-open the merchant rather than `refresh()`, which re-renders the *section* and
        // would bounce the operator back to the list they came from.
        await openMerchant(org.id);
      },
    });
  }

  function pageHead(title, subtitle, actions = []) {
    return h('div', { class: 'head' }, [
      h('div', {}, [h('h1', { text: title }), subtitle ? h('p', { class: 'sub', text: subtitle }) : null]),
      actions.length > 0 ? h('div', { class: 'row' }, actions) : null,
    ]);
  }

  // ── modal, and the elevation prompt ─────────────────────────────────────

  function closeModal() {
    el('modal-root').textContent = '';
  }

  /**
   * A modal that collects a note, and a code when the action is elevation-gated.
   *
   * The code is asked for here, before submitting, rather than after a 403. An
   * operator who has typed a considered review note should not lose it because their
   * two-minute window closed while they were writing.
   */
  function prompt({ title, note, permission, fields, confirmLabel, danger, onConfirm }) {
    const needsCode = permission && needsElevation(permission) && !elevationIsFresh(me?.mfaSatisfiedAt);
    const inputs = new Map();

    const body = h('div', { class: 'modal' }, [
      h('h2', { text: title }),
      note ? h('p', { class: 'modal-note', text: note }) : null,
      ...fields.map((field) => {
        const control =
          field.type === 'textarea'
            ? h('textarea', { id: `f-${field.name}`, placeholder: field.placeholder ?? '' })
            : h('input', {
                type: 'text',
                id: `f-${field.name}`,
                class: field.mono ? 'mono-input' : null,
                placeholder: field.placeholder ?? '',
                value: field.value ?? '',
              });
        inputs.set(field.name, control);
        return h('div', {}, [h('label', { class: 'field-label', for: `f-${field.name}`, text: field.label }), control]);
      }),
      needsCode
        ? h('div', {}, [
            h('label', { class: 'field-label', for: 'f-code', text: 'Authenticator code' }),
            (() => {
              const control = h('input', {
                type: 'text',
                id: 'f-code',
                class: 'mono-input',
                inputmode: 'numeric',
                maxlength: '6',
                placeholder: '000000',
              });
              inputs.set('code', control);
              return control;
            })(),
            h('p', { class: 'modal-note', style: 'margin-top:.35rem', text: 'This action needs your second factor confirmed again.' }),
          ])
        : null,
      h('div', { class: 'notice bad', id: 'modal-error', hidden: true }),
      h('div', { class: 'modal-actions' }, [
        h('button', { class: 'btn ghost', type: 'button', text: 'Cancel', onclick: closeModal }),
        h('button', { class: `btn ${danger ? 'danger' : 'primary'}`, type: 'button', text: confirmLabel, id: 'modal-confirm' }),
      ]),
    ]);

    const veil = h('div', { class: 'veil' }, [body]);
    el('modal-root').textContent = '';
    el('modal-root').append(veil);

    const values = () => {
      const out = {};
      for (const [name, control] of inputs) out[name] = control.value.trim();
      return out;
    };

    body.querySelector('#modal-confirm').addEventListener('click', async () => {
      const confirm = body.querySelector('#modal-confirm');
      const error = body.querySelector('#modal-error');
      confirm.disabled = true;
      error.hidden = true;

      try {
        const collected = values();
        if (needsCode) {
          if (!/^\d{6}$/.test(collected.code ?? '')) throw new Error('Enter the six-digit code.');
          await api('/admin/auth/reauthenticate', { method: 'POST', body: { code: collected.code } });
          // Reflect the fresh stamp so a second action in the same minute does not
          // ask again.
          me = { ...me, mfaSatisfiedAt: new Date().toISOString() };
        }
        await onConfirm(collected);
        closeModal();
      } catch (failure) {
        error.textContent = failure?.message ?? String(failure);
        error.hidden = false;
        confirm.disabled = false;
      }
    });

    const first = inputs.values().next().value;
    if (first) first.focus();
  }

  // ── sign in ─────────────────────────────────────────────────────────────

  let challengeToken = null;

  el('signin-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const error = el('signin-error');
    const submit = el('signin-submit');
    error.hidden = true;
    submit.disabled = true;

    try {
      if (challengeToken === null) {
        const outcome = await api('/admin/auth/login', {
          method: 'POST',
          body: { email: el('signin-email').value.trim(), password: el('signin-password').value },
        });
        challengeToken = outcome.challengeToken;
        el('signin-step-password').hidden = true;
        el('signin-step-code').hidden = false;
        el('signin-code-note').textContent =
          outcome.status === 'enrollment_required'
            ? `Add this secret to your authenticator, then enter the code: ${outcome.totpSecret}`
            : 'Enter the code from your authenticator app.';
        el('signin-submit').textContent = 'Sign in';
        el('signin-code').focus();
      } else {
        const outcome = await api('/admin/auth/complete', {
          method: 'POST',
          body: { challengeToken, code: el('signin-code').value.trim() },
        });
        token = outcome.sessionToken;
        await start();
      }
    } catch (failure) {
      error.textContent = failure?.message ?? String(failure);
      error.hidden = false;
      // A wrong code should not send the operator back to retyping their password.
      if (failure?.status === 401 && challengeToken !== null) el('signin-code').select();
    } finally {
      submit.disabled = false;
    }
  });

  el('sign-out').addEventListener('click', async () => {
    try {
      await api('/admin/auth/sign-out', { method: 'POST' });
    } finally {
      token = null;
      me = null;
      location.reload();
    }
  });

  /**
   * Preview mode, opened with `?preview=1`.
   *
   * Implemented by replacing `fetch`, not by branching inside the panel. Every render path,
   * every request and every error handler then runs exactly as it does against the real API.
   */
  function installPreview() {
    const routes = previewRoutes();
    window.fetch = async (input, init) => {
      const url = typeof input === 'string' ? input : input.url;
      const method = init?.method ?? (typeof input === 'string' ? 'GET' : input.method) ?? 'GET';
      const answer =
        method.toUpperCase() === 'GET'
          ? matchPreview(method, url, routes)
          : PREVIEW_REFUSAL;

      const route = answer ?? { status: 404, body: { error: 'preview', message: 'Not part of this preview.' } };
      return new Response(JSON.stringify(route.body), {
        status: route.status,
        headers: { 'content-type': 'application/json' },
      });
    };

    el('preview-banner').hidden = false;
    // A token so `api()` sends an Authorization header exactly as it would signed in. The
    // stub ignores it; the panel must not take a different path because of it.
    token = 'preview';
  }

  async function start() {
    me = await api('/admin/me');
    el('signin-screen').hidden = true;
    el('panel').hidden = false;

    el('me-email').textContent = me.email;
    const role = el('me-role');
    role.textContent = me.role;
    role.dataset.role = me.role;

    renderNav();
    await go(defaultSection(me.permissions));
  }

  function renderNav() {
    const nav = el('nav');
    nav.textContent = '';
    for (const item of visibleNav(me.permissions)) {
      const count = badges[item.id];
      nav.append(
        h('button', {
          class: 'nav-btn',
          type: 'button',
          'aria-current': String(item.id === section),
          onclick: () => void go(item.id),
        }, [
          h('span', { 'aria-hidden': 'true', text: item.marker }),
          item.label,
          count ? h('span', { class: `nav-count ${count > 0 ? 'alert' : ''}`.trim(), text: String(count) }) : null,
        ]),
      );
    }
  }

  async function go(next) {
    if (next === null) {
      render(view(), empty('Your role has no sections to show.', '🚫'));
      return;
    }
    section = next;
    renderNav();
    clearNotices();
    render(view(), h('div', { class: 'empty', text: 'Loading…' }));

    try {
      await SECTIONS[next]();
    } catch (failure) {
      showError(failure);
      render(view(), empty('Could not load this section.', '⚠️'));
    }
  }

  function refresh() {
    return go(section);
  }


  // ── sections ────────────────────────────────────────────────────────────

  const SECTIONS = {
    async health() {
      const data = await api('/admin/health');

      // Refresh the nav badges from the same payload rather than a second request.
      badges = { unmatched: data.reconciliation.pending, review: data.review.waiting };
      renderNav();

      const laggingChains = data.chains.filter(
        (chain) => chain.staleForMs !== null && chain.staleForMs > 5 * 60_000,
      );

      render(view(), 
        pageHead('Health', 'Everything that can be wrong without producing an error.', [
          h('button', { class: 'btn', type: 'button', text: 'Refresh', onclick: () => void refresh() }),
        ]),

        h('div', { class: 'grid cols', style: 'margin-bottom:1rem' }, [
          metric('Chains lagging', String(laggingChains.length), laggingChains.length > 0 ? 'bad' : 'good'),
          metric('Unmatched payments', String(data.reconciliation.pending), data.reconciliation.pending > 0 ? 'warn' : 'good'),
          metric('Contracts awaiting review', String(data.review.waiting), data.review.waiting > 0 ? 'warn' : 'good'),
          metric('Webhooks failed (1h)', String(data.webhooks.failedLastHour), data.webhooks.failedLastHour > 0 ? 'warn' : 'good'),
          metric('Oracle breakers open', String(data.oracle.openAssets.length), data.oracle.openAssets.length > 0 ? 'bad' : 'good'),
          metric(
            'Oldest unmatched',
            formatDuration(data.reconciliation.oldestPendingAgeMs),
            data.reconciliation.oldestPendingAgeMs !== null && data.reconciliation.oldestPendingAgeMs > 24 * 3600_000 ? 'bad' : null,
          ),
        ]),

        h('h2', { text: 'Watchers', style: 'margin:1.25rem 0 .5rem' }),
        h('p', { class: 'sub', style: 'margin:0 0 .5rem' },
          ['A watcher that stops polling is not seeing payments, and nothing else looks wrong while it happens.']),
        table(
          ['Chain', 'Scanned to', 'Last poll', 'Settlements pending', 'Stuck', 'Blocking nonce', 'Spend (1h)', 'Last error'],
          data.chains.map((chain) => {
            const lagging = chain.staleForMs !== null && chain.staleForMs > 5 * 60_000;
            const never = chain.lastPolledAt === null;
            return h('tr', {}, [
              h('td', {}, [h('strong', { text: chain.chain })]),
              td(chain.scannedTo === null ? '—' : String(chain.scannedTo), 'num'),
              h('td', { class: 'm' }, [
                never
                  ? tag('never polled', 'warn')
                  : tag(formatDuration(chain.staleForMs), lagging ? 'bad' : 'ok'),
              ]),
              td(String(chain.settlements.pending), 'num'),
              h('td', { class: 'num' }, [
                chain.settlements.stuck > 0 ? tag(String(chain.settlements.stuck), 'bad') : h('span', { class: 'faint', text: '0' }),
              ]),
              td(chain.settlements.blockingNonce === null ? '—' : String(chain.settlements.blockingNonce), 'num'),
              td(formatUsdMicros(chain.settlements.spentUsdMicros), 'num'),
              h('td', { class: 'dim', text: chain.lastError ?? '—' }),
            ]);
          }),
        ),

        data.oracle.openAssets.length > 0
          ? h('div', { class: 'notice bad', style: 'margin-top:1rem' }, [
              h('span', {}, [
                h('strong', { text: 'Quoting is suspended for: ' }),
                data.oracle.openAssets.join(', '),
              ]),
            ])
          : null,

        h('div', { class: 'notice info', style: 'margin-top:1rem' }, [
          h('span', {}, [
            h('strong', { text: 'Not checked here: ' }),
            data.unavailable.join(' · '),
          ]),
        ]),
      );
    },

    async merchants() {
      const search = el('merchant-search')?.value ?? '';

        type: 'search', id: 'merchant-search', value: search, placeholder: 'Name or slug',

        h('option', { value: 'active', text: 'Active', selected: filter === 'active' }),

      ]);

      render(view(), 
        pageHead('Merchants', `${data.total} total`, [searchBox, filterBox,
          h('button', { class: 'btn', type: 'button', text: 'Search', onclick: () => void refresh() })]),
        table(
          ['Merchant', 'State', 'Members', 'Invoices', 'Paid volume', 'Last invoice', ''],
          data.items.map((item) =>
            h('tr', { class: 'clickable', onclick: () => void openMerchant(item.id) }, [
              h('td', {}, [
                h('strong', { text: item.name }),
                h('div', { class: 'faint', style: 'font-family:var(--mono);font-size:var(--s-2)', text: item.slug }),
              ]),
              h('td', {}, [item.suspendedAt ? tag('suspended', 'bad') : tag('active', 'ok')]),
              td(String(item.memberCount), 'num'),
              td(String(item.invoiceCount), 'num'),
              // Smallest units without an asset context, so the raw figure is shown
              // grouped rather than pretending to a decimal place it cannot know.
              td(formatUnitsGrouped(item.paidVolume, 0), 'num'),

              h('td', {}, [h('span', { class: 'faint', text: '→' })]),

    async revenue() {
      const data = await api('/admin/commission/revenue');

      render(view(),
        pageHead(
          'Revenue',
          'What every account pays, and what each has paid us.',
          [h('button', { class: 'btn', type: 'button', text: 'Refresh', onclick: () => void refresh() })],
        ),

        h('div', { class: 'grid cols', style: 'margin-bottom:1rem' }, [
          /**
           * Two headline figures, and the gap between them is the useful part. `Earned` is
           * commission the chain owes us on payments we have credited; `Swept` is the part
           * that has actually reached a collector wallet. One number would overstate what
           * we hold, and it is the number an owner would take to the bank.
           */
          metric('Earned', formatUsdMicros(data.creditedUsdMicros)),
          metric('Swept', formatUsdMicros(data.settledUsdMicros)),
          metric('Awaiting sweep', formatUsdMicros(
            (BigInt(data.creditedUsdMicros) - BigInt(data.settledUsdMicros)).toString(),
          ), BigInt(data.creditedUsdMicros) - BigInt(data.settledUsdMicros) > 0n ? 'warn' : null),
          metric('Accounts', String(data.accounts.length)),
        ]),

        h('p', { class: 'sub', style: 'margin:0 0 .75rem', text:
          'Estimated from what each payment was worth when it was credited. The commission ' +
          'itself is taken in token units on chain, so its dollar value moves afterwards — ' +
          'this is not a substitute for reading the collector wallets.' }),

        table(
          ['Account', 'Rate', 'Who pays', 'Earned', 'This period', 'Reviewed'],
          data.accounts.map((account) =>
            h('tr', {}, [
              h('td', { class: 'm' }, [
                h('button', {
                  class: 'btn ghost',
                  type: 'button',
                  text: shortenAddress(account.organizationId, 8, 4),
                  title: account.organizationId,
                  onclick: () => void openMerchant(account.organizationId),
                }),
              ]),
              h('td', {}, [
                tag(
                  (account.feeBps / 100).toFixed(2).replace(/\.?0+$/, '') + '%',
                  // Negotiated is worth marking: the ladder is not moving it, so nobody
                  // will notice if the deal has gone stale.
                  account.negotiated ? 'warn' : null,
                ),
              ]),
              h('td', { class: 'dim', text: account.feePayer === 'payer' ? 'their customer' : 'they absorb it' }),
              td(formatUsdMicros(account.commissionUsdMicros), 'num'),
              td(formatUsdMicros(account.volumeUsdMicros), 'num'),
              td(account.periodEnd ? formatAgo(account.periodEnd) : '—', 'm'),
            ]),
          ),
        ),
      );
    },

    async catalogue() {
      const data = await api('/admin/assets');
      const mayList = can(me.permissions, 'asset_list:write');

      /**
       * Grouped by chain, because that is the unit of the decision.
       *
       * Turning Solana on is one act covering every Solana asset, and a flat list sorted by
       * symbol would scatter those rows among five other chains.
       */
      const chains = [...new Set(data.assets.map((asset) => asset.chain))].sort();

      render(view(),
        pageHead(
          'Currencies',
          'What the platform offers, and what it merely trusts.',
          mayList
            ? [
                h('button', { class: 'btn primary', type: 'button', text: 'Add a currency', onclick: () => addAsset() }),
                h('button', { class: 'btn', type: 'button', text: 'Refresh', onclick: () => void refresh() }),
              ]
            : [h('button', { class: 'btn', type: 'button', text: 'Refresh', onclick: () => void refresh() })],
        ),

        /**
         * The distinction the whole section turns on, said once at the top.
         *
         * Every operator who opens this will be about to conflate the two columns, because
         * "approved" and "offered" sound like the same thing until somebody explains that
         * they are not.
         */
        h('div', { class: 'notice info', style: 'margin-bottom:1rem' }, [
          h('span', {}, [
            h('strong', { text: 'Approved is not the same as offered. ' }),
            'Approved means we have checked the contract is what it claims to be. Offered ' +
              'means we are taking it today — which depends on our own watcher and price ' +
              'feed for that chain, not on the contract. Closing a currency stops new ' +
              'invoices only; anything already open still completes.',
          ]),
        ]),

        /**
         * What we do not carry, before what we do.
         *
         * An absence has no row, so it can only be shown deliberately — and this is the
         * list somebody scanning for "why is USDC not there" is looking for. Each entry
         * names where the address must be read from, because adding a curated currency
         * bypasses the probe entirely.
         */
        /**
         * What we do not carry, and which kind of absence each one is.
         *
         * Rendered as two separate notices because they call for opposite responses. A
         * currency the issuer never minted is an answer — showing it as a task sends somebody
         * looking for an address that is findable and wrong, which is how a discontinued
         * contract ends up approved for every merchant. A currency that exists and has not
         * been verified is the one worth nagging about.
         */
        ...gapNotices(data.gaps || [], mayList),

        ...chains.flatMap((chain) => {
          const rows = data.assets.filter((asset) => asset.chain === chain);
          const offered = rows.filter((asset) => asset.listed && asset.verdict === 'approved').length;

          return [
            h('div', { class: 'head', style: 'margin:1.25rem 0 .5rem' }, [
              h('div', {}, [
                h('h2', { text: chain }),
                h('p', { class: 'sub', text: `${offered} of ${rows.length} offered to merchants` }),
              ]),
            ]),
            table(
              ['Currency', 'Contract', 'Backed by', 'Decimals', 'Verdict', 'Offered', 'Price feed', 'In use', ''],
              rows.map((asset) =>
                h('tr', {}, [
                  h('td', {}, [
                    h('div', { class: 'm', text: asset.symbol }),
                    asset.curated
                      ? h('div', { class: 'faint', style: 'font-size:var(--s-2)', text: 'curated' })
                      : asset.submittedByOrganizationId
                        ? h('div', { class: 'faint', style: 'font-size:var(--s-2)', text: 'merchant-submitted' })
                        : h('div', { class: 'faint', style: 'font-size:var(--s-2)', text: 'added by staff' }),
                  ]),
                  h('td', { class: 'm' }, [
                    asset.contract
                      ? h('span', { title: asset.contract, text: shortenAddress(asset.contract, 10, 6) })
                      : h('span', { class: 'faint', text: 'native' }),
                  ]),
                  h('td', {}, [
                    /**
                     * Who stands behind the token, which is not the same question as whether
                     * the contract is real. Binance-Peg BSC-USD is a Binance liability, not a
                     * Tether one — usable, but a different promise from the same three letters.
                     */
                    asset.issuer === 'bridged'
                      ? h('span', { class: 'tag warn', title: asset.note ?? '', text: 'bridged' })
                      : asset.issuer === 'native'
                        ? h('span', { class: 'tag ok', title: asset.note ?? '', text: 'issuer' })
                        : h('span', { class: 'faint', text: '—' }),
                  ]),
                  td(String(asset.decimals), 'num'),
                  h('td', {}, [
                    tag(asset.verdict, asset.verdict === 'approved' ? 'ok' : asset.verdict === 'blocked' ? 'bad' : 'warn'),
                  ]),
                  h('td', {}, [tag(asset.listed ? 'yes' : 'no', asset.listed ? 'ok' : 'bad')]),
                  h('td', {}, [
                    /**
                     * Shown because it decides what a merchant has to do next. An asset
                     * nothing can price is usable only with a rate the merchant sets
                     * themselves, and that is worth knowing before offering it rather than
                     * after the first support message.
                     */
                    asset.priced
                      ? tag('quoted', 'ok')
                      : tag('merchant sets rate', 'warn'),
                  ]),
                  td(String(asset.enabledByMerchants), 'num'),
                  h('td', {}, [
                    mayList
                      ? h('button', {
                          class: `btn sm ${asset.listed ? 'danger' : 'primary'}`,
                          type: 'button',
                          text: asset.listed ? 'Close' : 'Open',
                          onclick: () => setListing(asset),
                        })
                      : null,
                  ]),
                ]),
              ),
            ),
          ];
        }),
      );
    },

        ['ignored', 'Ignored'], ['all', 'All'],

      render(view(), 
        pageHead('Unmatched payments', `${data.pendingTotal} still unresolved — each one is somebody waiting.`, [filterBox]),
        table(

          data.rows.map((row) =>

  // ── merchant detail ─────────────────────────────────────────────────────

  async function openMerchant(orgId) {
    render(view(), h('div', { class: 'empty', text: 'Loading…' }));
    const [data, balance] = await Promise.all([
      api(`/admin/merchants/${orgId}`),
      /**
       * Fetched beside the merchant rather than behind a click.
       *
       * A support call about a raised fee starts here, and the answer is in the statement. One
       * more request is cheaper than an operator who does not know the screen exists.
       */
      api(`/admin/balances/${orgId}`).catch(() => null),
    ]);
    const org = data.organization;
    const suspended = org.suspendedAt !== null;

    const actions = [h('button', { class: 'btn ghost', type: 'button', text: '← Merchants', onclick: () => void go('merchants') })];
    if (can(me.permissions, 'merchant:suspend')) {
      actions.push(
        suspended
          ? h('button', { class: 'btn primary', type: 'button', text: 'Reinstate', onclick: () => reinstate(org) })
          : h('button', { class: 'btn danger', type: 'button', text: 'Suspend', onclick: () => suspend(org) }),
      );
    }

    render(view(), 
      pageHead(org.name, org.slug, actions),

      suspended
        ? h('div', { class: 'notice bad', style: 'margin-bottom:1rem' }, [
            h('span', {}, [h('strong', { text: 'Suspended. ' }), org.suspendedReason ?? '']),
          ])
        : null,

      h('div', { class: 'grid cols', style: 'margin-bottom:1rem' },
        Object.entries(data.invoicesByStatus).length === 0
          ? [metric('Invoices', '0')]
          : Object.entries(data.invoicesByStatus).map(([status, value]) =>
              metric(status, String(value), status === 'underpaid' || status === 'overpaid' ? 'warn' : null)),
      ),

      h('h2', { text: 'Commission', style: 'margin:1.25rem 0 .5rem' }),
      commissionBlock(org, data),

      h('h2', { text: 'Balance', style: 'margin:1.25rem 0 .5rem' }),
      balanceBlock(org, balance),

      h('h2', { text: 'Members', style: 'margin:1.25rem 0 .5rem' }),
      table(['Email', 'Role', 'Verified', 'Two-factor', 'Joined'], data.members.map((member) =>
        h('tr', {}, [
          td(member.email, 'm'),
          h('td', {}, [tag(member.role, member.role === 'owner' ? 'lime' : null)]),
          h('td', {}, [member.emailVerifiedAt ? tag('yes', 'ok') : tag('no', 'warn')]),
          // Absent two-factor on an owner is worth seeing: they hold payout_address:write.
          h('td', {}, [member.totpEnabledAt ? tag('yes', 'ok') : tag('no', member.role === 'owner' ? 'bad' : 'warn')]),
          td(formatAgo(member.joinedAt), 'm'),
        ]),
      )),

      h('h2', { text: 'Payout addresses', style: 'margin:1.25rem 0 .5rem' }),
      h('p', { class: 'sub', style: 'margin:0 0 .5rem', text: 'Superseded entries are kept — "it used to go here" is the question that gets asked.' }),
      table(['Chain', 'Address', 'Active from', 'Superseded'], data.payoutAddresses.map((row) =>
        h('tr', {}, [
          td(row.chain),
          h('td', { class: 'm' }, [h('span', { title: row.address, text: shortenAddress(row.address, 10, 6) })]),
          td(formatAgo(row.createdAt), 'm'),
          h('td', {}, [row.supersededAt ? tag(formatAgo(row.supersededAt), null) : tag('current', 'ok')]),
        ]),
      )),

      h('h2', { text: 'API keys', style: 'margin:1.25rem 0 .5rem' }),
      table(['Name', 'Mode', 'Prefix', 'Last used', 'State'], data.apiKeys.map((key) =>
        h('tr', {}, [
          h('td', { text: key.name }),
          h('td', {}, [tag(key.mode, key.mode === 'live' ? 'lime' : null)]),
          td(key.displayPrefix, 'm'),
          td(formatAgo(key.lastUsedAt), 'm'),
          h('td', {}, [key.revokedAt ? tag('revoked', 'bad') : tag('active', 'ok')]),
        ]),
      )),

      h('h2', { text: 'Recent invoices', style: 'margin:1.25rem 0 .5rem' }),
      table(['Created', 'Chain', 'Reference', 'Due', 'Paid', 'Status'], data.recentInvoices.map((invoice) =>
        h('tr', {}, [
          td(formatAgo(invoice.createdAt), 'm'),
          td(invoice.chain),
          h('td', { class: 'dim', text: invoice.reference ?? '—' }),
          td(formatUnitsGrouped(invoice.amountDue, 0), 'num'),
          td(formatUnitsGrouped(invoice.amountPaid, 0), 'num'),
          h('td', {}, [
            tag(invoice.status, invoice.status === 'paid' ? 'ok'
              : invoice.status === 'underpaid' || invoice.status === 'overpaid' ? 'warn' : null),
          ]),
        ]),
      )),
    );
  }

  function suspend(org) {
    prompt({
      title: `Suspend ${org.name}?`,
      note: 'Takes effect immediately: new invoices and API calls are refused. Funds already received still settle to the merchant — withholding them would be theft, not enforcement.',
      permission: 'merchant:suspend',
      danger: true,
      confirmLabel: 'Suspend',
      fields: [{
        name: 'reason', label: 'Reason (shown to the merchant)', type: 'textarea',
        placeholder: 'At least a sentence — this is what they read when they are refused.',
      }],
      onConfirm: async ({ reason }) => {
        await api(`/admin/merchants/${org.id}/suspend`, { method: 'POST', body: { reason } });
        showOk('Suspended.');
        await openMerchant(org.id);
      },
    });
  }

  function reinstate(org) {
    prompt({
      title: `Reinstate ${org.name}?`,
      note: 'The suspension reason is cleared from the record here but stays in the audit trail.',
      permission: 'merchant:suspend',
      confirmLabel: 'Reinstate',
      fields: [{ name: 'note', label: 'Note (optional)', type: 'textarea', placeholder: 'What resolved it.' }],
      onConfirm: async ({ note }) => {
        await api(`/admin/merchants/${org.id}/reinstate`, { method: 'POST', body: note ? { note } : {} });
        showOk('Reinstated.');
        await openMerchant(org.id);
      },
    });
  }

  // ── contract review ─────────────────────────────────────────────────────

  function reviewCard(item) {
    const decide = (decision) =>
      prompt({
        title: `${decision === 'approved' ? 'Approve' : 'Block'} ${item.symbol}?`,
        note: decision === 'approved'
          ? 'Approving lets this contract be credited as money by any merchant who enables it.'
          : 'Blocking prevents any merchant from enabling it.',
        permission: 'contract:decide',
        danger: decision === 'blocked',
        confirmLabel: decision === 'approved' ? 'Approve' : 'Block',
        fields: [{
          name: 'note', label: 'Reason', type: 'textarea',
          placeholder: 'What you checked and what convinced you. This is the only durable record of why.',
        }],
        onConfirm: async ({ note }) => {
          await api(`/admin/contracts/${item.assetId}/decision`, { method: 'POST', body: { decision, note } });
          showOk(decision === 'approved' ? 'Approved.' : 'Blocked.');
          await refresh();
        },
      });

    const findings = item.findings ?? [];
    const worrying = findings.filter((finding) => finding && finding.result !== 'absent');

    return h('div', { class: 'card' }, [
      h('div', { class: 'card-head' }, [
        h('div', {}, [
          h('h2', {}, [item.symbol, ' ', h('span', { class: 'faint', style: 'font-family:var(--mono);font-size:var(--s-1)', text: item.chain })]),
          h('p', { class: 'sub', text: `submitted ${formatAgo(item.createdAt)} by ${item.submittedByOrganizationName ?? 'unknown merchant'}` }),
        ]),
        can(me.permissions, 'contract:decide')
          ? h('div', { class: 'row' }, [
              h('button', { class: 'btn danger sm', type: 'button', text: 'Block', onclick: () => decide('blocked') }),
              h('button', { class: 'btn primary sm', type: 'button', text: 'Approve', onclick: () => decide('approved') }),
            ])
          : tag('read only', null),
      ]),
      h('div', { class: 'card-body' }, [
        h('dl', { class: 'kv', style: 'margin:0 0 .75rem' }, [
          h('dt', { text: 'Contract' }), h('dd', { text: item.contract ?? 'native' }),
          h('dt', { text: 'Decimals' }), h('dd', { text: String(item.decimals) }),
          h('dt', { text: 'Kind' }), h('dd', { text: item.kind }),
          h('dt', { text: 'Probed' }), h('dd', { text: formatAgo(item.probedAt) }),
          h('dt', { text: 'Merchants waiting' }), h('dd', { text: String(item.waitingMerchants) }),
        ]),

        item.requiresFixedRate
          ? h('div', { class: 'notice warn', style: 'margin-bottom:.75rem' }, [
              'No price source can quote this, so the merchant must supply a fixed rate.',
            ])
          : null,

        findings.length === 0
          ? h('p', { class: 'sub', text: 'The probe returned no findings.' })
          : h('div', { class: 'scroll' }, [
              h('table', {}, [
                h('thead', {}, [h('tr', {}, ['Check', 'Result', 'Detail'].map((label) => h('th', { text: label })))]),
                h('tbody', {}, findings.map((finding) =>
                  h('tr', {}, [
                    td(String(finding?.check ?? '—'), 'm'),
                    h('td', {}, [
                      // `unknown` never reads as `absent`: a probe that could not tell
                      // is not a probe that found nothing.
                      tag(String(finding?.result ?? '—'),
                        finding?.result === 'absent' ? 'ok'
                        : finding?.result === 'unknown' ? 'warn' : 'bad'),
                    ]),
                    h('td', { class: 'dim', text: finding?.detail ?? '' }),
                  ]),
                )),
              ]),
            ]),

        worrying.length > 0
          ? h('div', { class: 'notice warn', style: 'margin-top:.75rem' }, [
              `${worrying.length} finding${worrying.length === 1 ? '' : 's'} needs a human judgement before this can be credited as money.`,
            ])
          : null,
      ]),
    ]);
  }

  // ── unmatched detail ────────────────────────────────────────────────────

  async function openUnmatched(id) {
    render(view(), h('div', { class: 'empty', text: 'Loading…' }));
    const row = await api(`/admin/unmatched/${id}`);
    const decimals = row.assetDecimals;
    const amount = decimals === null
      ? `${formatUnitsGrouped(row.amount, 0)} (smallest units — token unknown)`
      : `${formatUnitsGrouped(row.amount, decimals)} ${row.assetSymbol ?? ''}`;

    const attach = (invoiceId) =>
      prompt({
        title: 'Attach this transfer to the invoice?',
        note: 'The invoice is recomputed exactly as the watcher would have done, so a partial transfer lands as underpaid rather than paid.',
        permission: 'payment:reassign',
        confirmLabel: 'Attach and credit',
        fields: [{
          name: 'note', label: 'Why this invoice', type: 'textarea',
          placeholder: 'What ties this transfer to that invoice.',
        }],
        onConfirm: async ({ note }) => {
          const result = await api(`/admin/unmatched/${id}/attach`, { method: 'POST', body: { invoiceId, note } });
          showOk(result.message);
          await go('unmatched');
        },
      });

    const resolve = (resolution) =>
      prompt({
        title: resolution === 'returned' ? 'Mark for return?' : 'Leave this as-is?',
        note: resolution === 'returned'
          ? 'This records the decision only. No transfer is made — returning crypto is a separate, confirmed action, because the sending address is often an exchange wallet where a return is simply lost.'
          : 'Records that this was looked at and deliberately left alone.',
        permission: 'payment:reassign',
        danger: resolution === 'returned',
        confirmLabel: resolution === 'returned' ? 'Mark for return' : 'Leave it',
        fields: [{ name: 'note', label: 'Note', type: 'textarea', placeholder: 'What you decided and why.' }],
        onConfirm: async ({ note }) => {
          const result = await api(`/admin/unmatched/${id}/resolve`, { method: 'POST', body: { resolution, note } });
          showOk(result.message);
          await go('unmatched');
        },
      });

    const mayAct = can(me.permissions, 'payment:reassign') && row.resolution === 'pending';

    render(view(), 
      pageHead('Unmatched payment', `${row.chain} · seen ${formatAgo(row.seenAt)}`, [
        h('button', { class: 'btn ghost', type: 'button', text: '← Queue', onclick: () => void go('unmatched') }),
        mayAct ? h('button', { class: 'btn', type: 'button', text: 'Mark for return', onclick: () => resolve('returned') }) : null,
        mayAct ? h('button', { class: 'btn ghost', type: 'button', text: 'Ignore', onclick: () => resolve('ignored') }) : null,
      ].filter(Boolean)),

      h('div', { class: 'card', style: 'margin-bottom:1rem' }, [
        h('div', { class: 'card-body' }, [
          h('dl', { class: 'kv' }, [
            h('dt', { text: 'Amount' }), h('dd', { text: amount }),
            h('dt', { text: 'Reason' }), h('dd', { text: row.reason.replace(/_/g, ' ') }),
            h('dt', { text: 'To' }), h('dd', { text: row.toAddress }),
            h('dt', { text: 'From' }), h('dd', { text: row.fromAddress ?? 'unknown' }),
            h('dt', { text: 'Memo' }), h('dd', { text: row.memo ?? 'none' }),
            h('dt', { text: 'Transaction' }), h('dd', { text: `${row.txHash}:${row.transferIndex}` }),
            h('dt', { text: 'Block' }), h('dd', { text: String(row.blockNumber) }),
            h('dt', { text: 'State' }), h('dd', { text: row.resolution }),
            row.note ? h('dt', { text: 'Note' }) : null,
            row.note ? h('dd', { style: 'font-family:var(--sans)', text: row.note }) : null,
          ].filter(Boolean)),
        ]),
      ]),

      h('h2', { text: 'Invoices sharing this deposit address', style: 'margin:1.25rem 0 .5rem' }),
      h('p', { class: 'sub', style: 'margin:0 0 .5rem', text: 'Candidates, not a decision. On a memo chain several invoices share one address.' }),
      (row.candidates ?? []).length === 0
        ? empty('No invoice claims this address. It may be a payment to an address we never issued.', '🕳️')
        : table(['Invoice', 'Due', 'Paid', 'Status', 'Memo', 'Expires', ''], (row.candidates ?? []).map((candidate) =>
            h('tr', {}, [
              td(shortenAddress(candidate.id, 8, 4), 'm'),
              td(formatUnitsGrouped(candidate.amountDue, 0), 'num'),
              td(formatUnitsGrouped(candidate.amountPaid, 0), 'num'),
              h('td', {}, [tag(candidate.status, candidate.status === 'paid' ? 'ok' : null)]),
              td(candidate.memo ?? '—', 'm'),
              td(formatAgo(candidate.expiresAt), 'm'),
              h('td', {}, [
                mayAct
                  ? h('button', { class: 'btn primary sm', type: 'button', text: 'Attach', onclick: () => attach(candidate.id) })
                  : null,
              ]),
            ]),
          )),
    );
  }


  if (new URLSearchParams(location.search).get('preview') === '1') {
    installPreview();
    void start().catch((failure) => showError(failure));
  } else {
    // Nothing is fetched until a session exists.
    el('signin-email').focus();
  }
})();
</script>
